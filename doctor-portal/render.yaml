# Doctor Portal — Render Web Service (Node / Next.js)
# Create in Render: New → Blueprint → connect repo → set blueprint path to: doctor-portal/render.yaml
# After deploy, add your portal URL to the backend: CORS_EXTRA_ORIGINS in the API service env (comma-separated).

services:
  - type: web
    name: who-doctor-portal
    runtime: node
    plan: free
    rootDir: doctor-portal
    buildCommand: npm install && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      # Baked into the client bundle at build time; override in dashboard if your API URL differs
      - key: NEXT_PUBLIC_API_URL
        value: https://claude-hackathon-u86l.onrender.com
