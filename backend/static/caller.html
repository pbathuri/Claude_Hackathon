<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WHO Health Access — Caller</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e27;--bg2:#111638;--bg3:#1a2048;
  --cyan:#00d4ff;--cyan-dim:rgba(0,212,255,.15);--cyan-glow:rgba(0,212,255,.35);
  --green:#00e676;--green-dim:rgba(0,230,118,.12);
  --red:#ff1744;--red-dim:rgba(255,23,68,.12);
  --yellow:#ffd600;
  --txt:#e8eaf6;--txt2:#9fa8da;--txt3:#5c6bc0;
  --radius:14px;--radius-sm:10px;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
body{display:flex;flex-direction:column}

/* ── Header ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg2);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.header-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.3px}
.header-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.call-status{font-size:13px;color:var(--txt2);display:flex;align-items:center;gap:8px}
.call-timer{font-variant-numeric:tabular-nums;font-family:'SF Mono',Menlo,monospace;color:var(--cyan);font-size:13px}

/* ── Dialer ── */
.dialer{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:24px;padding:30px 20px}
.dialer-title{font-size:22px;font-weight:700;color:var(--txt)}
.dialer-sub{font-size:14px;color:var(--txt2);text-align:center;max-width:340px;line-height:1.5}
.phone-row{display:flex;gap:10px;width:100%;max-width:380px}
.country-select{background:var(--bg3);color:var(--txt);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-sm);padding:14px 12px;font-size:15px;cursor:pointer;width:130px;appearance:none;-webkit-appearance:none}
.country-select:focus{outline:none;border-color:var(--cyan)}
.phone-input{flex:1;background:var(--bg3);color:var(--txt);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-sm);padding:14px 16px;font-size:17px;letter-spacing:1px}
.phone-input::placeholder{color:var(--txt3)}
.phone-input:focus{outline:none;border-color:var(--cyan)}
.btn-call{width:100%;max-width:380px;padding:18px;border:none;border-radius:var(--radius);font-size:17px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-call.start{background:var(--green);color:#0a0e27}
.btn-call.start:hover{box-shadow:0 0 30px rgba(0,230,118,.4)}
.btn-call.end{background:var(--red);color:#fff}
.btn-call:disabled{opacity:.4;cursor:not-allowed}

/* ── Call Screen ── */
.call-screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.call-screen.active{display:flex}
.dialer.hidden{display:none}

/* ── Disclosure Banner ── */
.disclosure{background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(0,230,118,.06));border:1px solid rgba(0,212,255,.2);border-radius:var(--radius);margin:12px 16px;padding:14px 16px;font-size:13px;line-height:1.55;color:var(--txt2);flex-shrink:0;max-height:120px;overflow-y:auto}
.disclosure strong{color:var(--cyan);font-weight:600}

/* ── Chat Area ── */
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:82%;padding:12px 16px;border-radius:var(--radius);font-size:14.5px;line-height:1.5;word-wrap:break-word;animation:msgIn .25s ease-out}
.msg.ai{align-self:flex-start;background:var(--bg3);border:1px solid rgba(255,255,255,.06);color:var(--txt)}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#1565c0,#1976d2);color:#fff}
.msg.system{align-self:center;background:transparent;color:var(--txt3);font-size:12px;text-align:center;padding:6px}
.msg .img-thumb{max-width:180px;border-radius:8px;margin-top:8px;display:block}
.msg .conditions{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.msg .cond-tag{font-size:11px;background:var(--cyan-dim);color:var(--cyan);padding:3px 8px;border-radius:20px}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── Speaking indicator ── */
.speaking-bar{display:none;align-items:center;gap:10px;padding:8px 20px;background:var(--bg2);border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.speaking-bar.active{display:flex}
.speaking-dots{display:flex;gap:4px}
.speaking-dots span{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 1.2s infinite ease-in-out}
.speaking-dots span:nth-child(2){animation-delay:.2s}
.speaking-dots span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
.speaking-label{font-size:12px;color:var(--txt2)}

/* ── Input Bar ── */
.input-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg2);border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.btn-icon{width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.btn-mic{background:var(--cyan);color:#0a0e27}
.btn-mic:hover{box-shadow:0 0 20px var(--cyan-glow)}
.btn-mic.listening{background:var(--red);animation:micPulse 1s infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,23,68,.5)}50%{box-shadow:0 0 0 14px rgba(255,23,68,0)}}
.btn-cam{background:var(--bg3);color:var(--txt2);border:1px solid rgba(255,255,255,.1)}
.btn-cam:hover{border-color:var(--cyan);color:var(--cyan)}
.text-input{flex:1;background:var(--bg3);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:13px 16px;font-size:14px;color:var(--txt);resize:none;min-height:48px;max-height:80px}
.text-input::placeholder{color:var(--txt3)}
.text-input:focus{outline:none;border-color:var(--cyan)}
.btn-send{background:var(--cyan);color:#0a0e27;font-weight:700;font-size:18px}
.transcript-preview{position:absolute;bottom:80px;left:16px;right:16px;background:var(--bg3);border:1px solid var(--cyan);border-radius:var(--radius);padding:12px 16px;font-size:14px;color:var(--txt2);display:none}
.transcript-preview.active{display:block}

/* ── Emergency Overlay ── */
.emergency-overlay{display:none;position:fixed;inset:0;background:rgba(255,23,68,.15);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:16px;animation:emergencyFlash 1s infinite}
.emergency-overlay.active{display:flex}
.emergency-overlay h1{font-size:36px;color:var(--red);text-align:center;text-shadow:0 0 30px rgba(255,23,68,.5)}
.emergency-overlay p{font-size:18px;color:#fff;text-align:center}
.emergency-overlay .btn-dismiss{padding:14px 40px;background:var(--red);color:#fff;border:none;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer}
@keyframes emergencyFlash{0%,100%{background:rgba(255,23,68,.1)}50%{background:rgba(255,23,68,.2)}}

/* ── Summary Card ── */
.summary-card{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:24px;gap:16px}
.summary-card.active{display:flex}
.summary-inner{background:var(--bg2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:28px 24px;width:100%;max-width:400px;text-align:center}
.summary-inner h2{font-size:20px;margin-bottom:4px}
.summary-inner .triage-badge{display:inline-block;padding:6px 20px;border-radius:20px;font-weight:700;font-size:14px;margin:12px 0}
.triage-RED{background:var(--red);color:#fff}
.triage-YELLOW{background:var(--yellow);color:#000}
.triage-GREEN{background:var(--green);color:#000}
.summary-inner .detail{font-size:13px;color:var(--txt2);margin:4px 0}
.summary-inner .link-portal{display:inline-block;margin-top:16px;padding:12px 28px;background:var(--cyan);color:#0a0e27;border-radius:var(--radius);font-weight:700;text-decoration:none;font-size:14px}

/* ── Connecting Anim ── */
.connecting{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px}
.connecting.active{display:flex}
.connecting-ring{width:60px;height:60px;border-radius:50%;border:3px solid var(--cyan-dim);border-top-color:var(--cyan);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.connecting-text{font-size:16px;color:var(--txt2)}

/* ── Footer ── */
.footer{padding:10px 20px;text-align:center;font-size:11px;color:var(--txt3);flex-shrink:0;border-top:1px solid rgba(255,255,255,.04)}
</style>
</head>
<body>

<!-- Emergency Overlay -->
<div class="emergency-overlay" id="emergencyOverlay">
  <h1>EMERGENCY</h1>
  <p>Call <strong>112</strong> / <strong>911</strong> immediately</p>
  <button class="btn-dismiss" onclick="dismissEmergency()">I understand — Continue</button>
</div>

<!-- Header -->
<div class="header">
  <div class="header-brand"><span class="dot"></span> WHO Health Access</div>
  <div class="call-status" id="callStatus">
    <span id="statusText">Ready</span>
    <span class="call-timer" id="callTimer" style="display:none">00:00</span>
  </div>
</div>

<!-- Dialer Screen -->
<div class="dialer" id="dialerScreen">
  <div class="dialer-title">Start a Health Call</div>
  <div class="dialer-sub">Speak with an AI health assistant. Your symptoms will be assessed and routed to a qualified physician.</div>
  <div class="phone-row">
    <select class="country-select" id="countrySelect">
      <option value="+234">&#x1F1F3;&#x1F1EC; +234</option>
      <option value="+254">&#x1F1F0;&#x1F1EA; +254</option>
      <option value="+91">&#x1F1EE;&#x1F1F3; +91</option>
      <option value="+63">&#x1F1F5;&#x1F1ED; +63</option>
    </select>
    <input class="phone-input" id="phoneInput" type="tel" placeholder="Phone number" maxlength="12">
  </div>
  <button class="btn-call start" id="btnCall" onclick="startCall()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.58 1 1 0 01-.25 1.01l-2.2 2.2z"/></svg>
    Call
  </button>
</div>

<!-- Connecting Animation -->
<div class="connecting" id="connectingScreen">
  <div class="connecting-ring"></div>
  <div class="connecting-text">Connecting to health service...</div>
</div>

<!-- Call Screen -->
<div class="call-screen" id="callScreen">
  <div class="disclosure" id="disclosureBanner" style="display:none"></div>
  <div class="chat" id="chatArea"></div>
  <div class="speaking-bar" id="speakingBar">
    <div class="speaking-dots"><span></span><span></span><span></span></div>
    <span class="speaking-label">AI is speaking...</span>
  </div>
  <div class="transcript-preview" id="transcriptPreview"></div>
  <div class="input-bar" id="inputBar">
    <button class="btn-icon btn-cam" id="btnCam" onclick="openCamera()" title="Upload photo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
    <input class="text-input" id="textInput" placeholder="Type or press mic to speak..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}">
    <button class="btn-icon btn-mic" id="btnMic" onclick="toggleMic()" title="Press to speak">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 0014 0h-2zm-5 9a7 7 0 007-7h-2a5 5 0 01-10 0H5a7 7 0 007 7zm0 2v2h-2v-2h2z"/></svg>
    </button>
    <button class="btn-icon btn-send" id="btnSend" onclick="sendText()" title="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- Summary Card -->
<div class="summary-card" id="summaryCard">
  <div class="summary-inner" id="summaryInner"></div>
</div>

<!-- Footer -->
<div class="footer">WHO-Aligned Health Access Service — AI Guidance Only</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" onchange="handleImageUpload(this)">

<script>
const API = '';
let caseId = null, sessionData = null;
let turnNumber = 1, collectedSymptoms = [], messageHistory = [];
let recognition = null, isListening = false;
let timerInterval = null, callSeconds = 0;
let synth = window.speechSynthesis;
let extractedSeverity = 5, extractedDuration = '', extractedBodyArea = '';
let currentAudio = null;
let isSpeaking = false;

/* ── Audio beep ── */
function beep(freq = 880, dur = 120) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq; gain.gain.value = 0.15;
    osc.start(); osc.stop(ctx.currentTime + dur / 1000);
  } catch (e) {}
}

/* ── Timer ── */
function startTimer() {
  callSeconds = 0;
  const el = document.getElementById('callTimer');
  el.style.display = '';
  timerInterval = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    el.textContent = `${m}:${s}`;
  }, 1000);
}
function stopTimer() { clearInterval(timerInterval); }

/* ── Start Call ── */
async function startCall() {
  const code = document.getElementById('countrySelect').value;
  const num = document.getElementById('phoneInput').value.trim();
  if (!num || num.length < 5) { alert('Enter a valid phone number'); return; }
  const phone = code + num;

  document.getElementById('dialerScreen').classList.add('hidden');
  document.getElementById('connectingScreen').classList.add('active');
  document.getElementById('statusText').textContent = 'Connecting...';

  try {
    const res = await fetch(`${API}/caller/session/start`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone_number: phone }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail?.reason || err.detail || 'Connection failed');
    }
    sessionData = await res.json();
    caseId = sessionData.case_id;

    await fetch(`${API}/caller/session/consent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ case_id: caseId, consent_given: true }),
    });

    setTimeout(() => {
      document.getElementById('connectingScreen').classList.remove('active');
      document.getElementById('callScreen').classList.add('active');
      document.getElementById('statusText').textContent = 'On Call';
      beep(880, 100); setTimeout(() => beep(1100, 150), 160);
      startTimer();

      if (sessionData.verbal_disclosure) {
        const banner = document.getElementById('disclosureBanner');
        banner.style.display = '';
        banner.innerHTML = `<strong>Capability Disclosure:</strong> ${sessionData.verbal_disclosure}`;
        speak(sessionData.verbal_disclosure);
      }
      addMessage('ai', 'Hello! I\'m your AI health assistant. Please describe your symptoms — you can speak or type.');
    }, 1500);
  } catch (e) {
    document.getElementById('connectingScreen').classList.remove('active');
    document.getElementById('dialerScreen').classList.remove('hidden');
    document.getElementById('statusText').textContent = 'Ready';
    alert('Could not connect: ' + e.message);
  }
}

/* ── Chat Messages ── */
function addMessage(role, text, extra) {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  if (extra?.imageUrl) {
    html += `<img class="img-thumb" src="${extra.imageUrl}" alt="uploaded">`;
  }
  if (extra?.conditions?.length) {
    html += '<div class="conditions">' +
      extra.conditions.map(c => `<span class="cond-tag">${c.name} ${Math.round(c.score * 100)}%</span>`).join('') +
      '</div>';
  }
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  messageHistory.push({ role, text });
}

/* ── Send text message ── */
async function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text || !caseId) return;
  input.value = '';
  addMessage('user', text);
  await processAITurn(text);
}

/* ── AI Turn ── */
async function processAITurn(userMessage) {
  try {
    const res = await fetch(`${API}/caller/ai-turn`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        case_id: caseId,
        user_message: userMessage,
        turn_number: turnNumber,
        collected_symptoms: collectedSymptoms,
        message_history: messageHistory,
        language: 'en',
      }),
    });
    const data = await res.json();

    collectedSymptoms = data.all_symptoms_so_far || collectedSymptoms;
    turnNumber = data.turn_number || turnNumber + 1;
    if (data.severity_extracted) extractedSeverity = data.severity_extracted;
    if (data.duration_extracted) extractedDuration = data.duration_extracted;
    if (data.body_area_extracted) extractedBodyArea = data.body_area_extracted;

    if (data.is_emergency) {
      document.getElementById('emergencyOverlay').classList.add('active');
    }

    addMessage('ai', data.ai_message, {
      conditions: data.activated_conditions,
    });
    speak(data.ai_message);

    if (data.should_complete) {
      setTimeout(() => submitCase(data.transcript_summary), 3000);
    }
  } catch (e) {
    addMessage('system', 'Connection error — please try again.');
  }
}

/* ── Submit Case ── */
async function submitCase(summary) {
  addMessage('system', 'Submitting your case to a physician...');
  try {
    const res = await fetch(`${API}/caller/session/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        case_id: caseId,
        symptoms: collectedSymptoms,
        message_history: messageHistory,
        transcript_summary: summary || collectedSymptoms.join(', '),
        severity: extractedSeverity,
        duration: extractedDuration,
        body_area: extractedBodyArea,
      }),
    });
    const data = await res.json();
    stopTimer();
    showSummary(data);
  } catch (e) {
    addMessage('system', 'Submission failed. Please contact support.');
  }
}

/* ── Summary ── */
function showSummary(data) {
  document.getElementById('callScreen').classList.remove('active');
  document.getElementById('inputBar').style.display = 'none';
  document.getElementById('statusText').textContent = 'Call Ended';
  const card = document.getElementById('summaryCard');
  card.classList.add('active');
  const triage = data.triage_level || 'GREEN';
  document.getElementById('summaryInner').innerHTML = `
    <h2>Case Submitted</h2>
    <span class="triage-badge triage-${triage}">${triage} Priority</span>
    <p class="detail"><strong>Case ID:</strong> ${data.case_id}</p>
    <p class="detail"><strong>Patient:</strong> ${data.patient_alias || 'Anonymous'}</p>
    <p class="detail"><strong>Symptoms:</strong> ${data.symptom_summary || collectedSymptoms.join(', ')}</p>
    <p class="detail"><strong>Urgency:</strong> ${data.urgency || 'Assessed'}</p>
    <p class="detail"><strong>Priority Score:</strong> ${data.priority_score ?? '—'}</p>
    ${data.is_emergency ? '<p class="detail" style="color:var(--red);font-weight:700">EMERGENCY — Seek immediate care</p>' : ''}
    <a class="link-portal" href="https://doctor-portal-flax.vercel.app/cases" target="_blank">Open Doctor Portal</a>
  `;
}

/* ── Speech Recognition ── */
function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.continuous = false;
  r.interimResults = true;
  r.lang = 'en-US';

  r.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    const preview = document.getElementById('transcriptPreview');
    if (interim) {
      preview.textContent = interim;
      preview.classList.add('active');
    }
    if (final) {
      preview.classList.remove('active');
      addMessage('user', final);
      processAITurn(final);
    }
  };
  r.onend = () => {
    isListening = false;
    document.getElementById('btnMic').classList.remove('listening');
    document.getElementById('transcriptPreview').classList.remove('active');
  };
  r.onerror = () => {
    isListening = false;
    document.getElementById('btnMic').classList.remove('listening');
  };
  return r;
}

function toggleMic() {
  if (!recognition) recognition = initSpeechRecognition();
  if (!recognition) { alert('Speech recognition not supported in this browser.'); return; }
  if (isListening) {
    recognition.stop();
    isListening = false;
    document.getElementById('btnMic').classList.remove('listening');
  } else {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if (isSpeaking && synth) synth.cancel();
    isSpeaking = false;
    document.getElementById('speakingBar').classList.remove('active');
    recognition.start();
    isListening = true;
    document.getElementById('btnMic').classList.add('listening');
  }
}

/* ── Text-to-Speech (ElevenLabs with browser fallback) ── */
async function speak(text) {
  if (!text) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  isSpeaking = true;
  document.getElementById('speakingBar').classList.add('active');

  try {
    const res = await fetch(`${API}/caller/tts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error('TTS API error');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    currentAudio.onended = () => {
      isSpeaking = false;
      document.getElementById('speakingBar').classList.remove('active');
      URL.revokeObjectURL(url);
      currentAudio = null;
    };
    currentAudio.onerror = () => {
      isSpeaking = false;
      document.getElementById('speakingBar').classList.remove('active');
      currentAudio = null;
    };
    await currentAudio.play();
  } catch (e) {
    if (synth) {
      synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const voices = synth.getVoices();
      const female = voices.find(v => /female|samantha|fiona|karen|moira|tessa/i.test(v.name))
        || voices.find(v => /en/i.test(v.lang)) || voices[0];
      if (female) utter.voice = female;
      utter.rate = 0.95; utter.pitch = 1.05;
      utter.onend = () => {
        isSpeaking = false;
        document.getElementById('speakingBar').classList.remove('active');
      };
      synth.speak(utter);
    } else {
      isSpeaking = false;
      document.getElementById('speakingBar').classList.remove('active');
    }
  }
}

/* ── Camera / Image Upload ── */
function openCamera() {
  document.getElementById('fileInput').click();
}

async function handleImageUpload(input) {
  if (!input.files.length || !caseId) return;
  const file = input.files[0];
  const fd = new FormData();
  fd.append('file', file);

  addMessage('user', 'Uploaded an image', { imageUrl: URL.createObjectURL(file) });

  try {
    const res = await fetch(`${API}/caller/upload-image`, { method: 'POST', body: fd });
    const data = await res.json();
    addMessage('system', `Image saved: ${data.filename}`);
  } catch (e) {
    addMessage('system', 'Image upload failed.');
  }
  input.value = '';
}

/* ── Emergency ── */
function dismissEmergency() {
  document.getElementById('emergencyOverlay').classList.remove('active');
}

/* ── Init voices ── */
if (synth) synth.onvoiceschanged = () => synth.getVoices();
</script>
