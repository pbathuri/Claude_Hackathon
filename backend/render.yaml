# Web service only. Set DATABASE_URL in the Render dashboard to your Postgres URI
# If the doctor portal is hosted on Render, set CORS_EXTRA_ORIGINS to its public URL, e.g.
#   https://who-doctor-portal.onrender.com
# (comma-separated if multiple). See doctor-portal/render.yaml for the portal blueprint.
# (e.g. Supabase: postgresql://postgres:...@db.<project-ref>.supabase.co:5432/postgres?sslmode=require).
# sync: false keeps the dashboard value from being overwritten by this file.

services:
  - type: web
    runtime: python
    name: who-triage-backend
    rootDir: backend
    # Install only at build time. Do not run Alembic here: DB is often unreachable from the
    # build network, migrations can time out, and a failed migrate looks like an opaque build failure.
    buildCommand: pip install -r requirements.txt
    # Migrate at runtime when DATABASE_URL is valid, then start the API.
    startCommand: sh -c "python -m alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_PHONE_NUMBER
        value: "+18449822145"
      - key: REDIS_URL
        sync: false
      - key: SKIP_PIPELINE_ENRICHMENT
        value: "1"
      - key: DEMO_MODE
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SKIP_TWILIO_SIGNATURE
        value: "0"
      - key: SENTRY_DSN
        sync: false
